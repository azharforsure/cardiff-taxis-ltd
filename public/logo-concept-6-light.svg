<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="gold6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <g transform="translate(30, 20)">
    <!-- Car Cabin -->
    <path d="M 25 60 L 35 40 L 65 40 L 75 60 Z" fill="#9CA3AF"/>
    <!-- Car Body -->
    <path d="M 15 80 L 25 60 L 75 60 L 85 80 Z" fill="#FFFFFF"/>
    <!-- Grille -->
    <rect x="40" y="65" width="20" height="10" fill="#E5E7EB" rx="2"/>
    <!-- Headlights -->
    <rect x="18" y="68" width="14" height="5" fill="#F59E0B" rx="2"/>
    <rect x="68" y="68" width="14" height="5" fill="#F59E0B" rx="2"/>
    <!-- Tires -->
    <rect x="15" y="80" width="10" height="15" fill="#111827" rx="3"/>
    <rect x="75" y="80" width="10" height="15" fill="#111827" rx="3"/>
    
    <!-- Airplane taking off from behind/above the car -->
    <path d="M 50 35 L 50 -5" stroke="url(#gold6)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 20 20 L 50 5 L 80 20" fill="none" stroke="url(#gold6)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <text x="160" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">CARDIFF TAXIS</text>
  <text x="164" y="115" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#F59E0B" letter-spacing="5">ELEVATING YOUR JOURNEY</text>
</svg>