    <rect x="60" y="0" width="10" height="10" fill="#111827"/>
    <rect x="70" y="0" width="10" height="10" fill="#F59E0B"/>
    <rect x="80" y="0" width="10" height="10" fill="#111827"/>
    <rect x="90" y="0" width="10" height="10" fill="#F59E0B"/>
    <rect x="100" y="0" width="10" height="10" fill="#111827"/>
    <rect x="110" y="0" width="10" height="10" fill="#F59E0B"/>
