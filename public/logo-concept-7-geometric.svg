<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="premiumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE047;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(40, 40)">
    <!-- Abstract Mark: Two sleek, parallel forward-moving chevrons -->
    <!-- Left Chevron (Road/Hire) -->
    <path d="M 0 0 L 30 40 L 0 80 L 15 80 L 45 40 L 15 0 Z" fill="#FFFFFF"/>
    <!-- Right Chevron (Air/Transfer) -->
    <path d="M 30 0 L 60 40 L 30 80 L 45 80 L 75 40 L 45 0 Z" fill="url(#premiumGold)"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="48" fill="#FFFFFF" letter-spacing="-0.5">CARDIFF TAXIS</text>
  <text x="153" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="15" fill="#9CA3AF" letter-spacing="8">LIMITED</text>
</svg>